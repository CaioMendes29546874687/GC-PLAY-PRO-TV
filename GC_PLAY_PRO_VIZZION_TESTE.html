<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GC PLAY PRO - Teste Vizzion</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}body{display:flex;align-items:center;justify-content:center}.box{width:min(850px,90vw);padding:45px;border:3px solid #28d905;border-radius:22px;text-align:center;box-shadow:0 0 35px rgba(40,217,5,.25)}h1{font-size:42px;margin:0 0 25px;color:#28d905}.label{font-size:27px;margin:15px}.code{font-size:64px;letter-spacing:14px;font-weight:bold;border:2px solid #28d905;border-radius:14px;padding:20px;margin:25px 0}.hint{font-size:24px;margin:15px}.btn{display:inline-block;margin-top:18px;padding:18px 45px;border:2px solid #28d905;border-radius:12px;font-size:28px;color:#fff;background:#111}.focus{outline:4px solid #fff;outline-offset:5px}</style></head><body><main class="box"><h1>GC PLAY PRO</h1><div class="label">TESTE VIZZION LE43DF20</div><div class="label">CÓDIGO DE ATIVAÇÃO</div><div id="code" class="code">------</div><div class="hint">Use as setas do controle e pressione OK</div><button id="ok" class="btn">CONTINUAR</button></main><script>(function(){var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var code='';for(var i=0;i<6;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));document.getElementById('code').textContent=code;var b=document.getElementById('ok');b.className+=' focus';try{b.focus()}catch(e){}document.addEventListener('keydown',function(e){if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();b.classList.add('focus')}if(e.key==='Enter'||e.key==='OK'){e.preventDefault();alert('OK recebido pela TV.')}},false);})();</script></body></html>
