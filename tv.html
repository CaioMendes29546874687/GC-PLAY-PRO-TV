<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GC PLAY PRO TV</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.box{width:min(900px,88vw);padding:35px 45px;border:3px solid #28d905;border-radius:22px;text-align:center;box-shadow:0 0 35px rgba(40,217,5,.25)}
h1{font-size:42px;margin:0 0 18px;color:#28d905}.label{font-size:26px;margin:10px}.code{font-size:60px;letter-spacing:12px;font-weight:bold;border:2px solid #28d905;border-radius:14px;padding:16px;margin:18px 0}.row{display:flex;align-items:center;justify-content:center;gap:45px;margin:18px 0}.qr{width:190px;height:190px;background:#fff;padding:10px;border-radius:8px;display:flex;align-items:center;justify-content:center}.qr img,.qr canvas{max-width:190px;max-height:190px}.hint{font-size:22px;margin:12px}.btn{display:inline-block;margin-top:12px;padding:16px 42px;border:2px solid #28d905;border-radius:12px;font-size:26px;color:#fff;background:#111}.focus{outline:4px solid #28d905;outline-offset:5px;box-shadow:0 0 20px rgba(40,217,5,.45)}
</style></head><body><main class="box"><h1>GC PLAY PRO</h1><div class="label">ATIVAÇÃO DO DISPOSITIVO</div><div class="label">Código de ativação</div><div id="code" class="code">------</div><div class="row"><div id="qr" class="qr"></div><div><div class="hint">Escaneie o QR Code pelo celular</div><div class="hint">ou use o código acima.</div><button id="ok" class="btn" type="button">CONTINUAR</button></div></div></main>
<script>
(function(){
  var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code=localStorage.getItem('gcplay_activation_code_tv');
  if(!code){code='';for(var i=0;i<6;i++)code+=chars.charAt(Math.floor(Math.random()*chars.length));localStorage.setItem('gcplay_activation_code_tv',code)}
  code=String(code).toUpperCase();
  document.getElementById('code').textContent=code;
  var deviceId=localStorage.getItem('gcplay_device_id_tv');
  if(!deviceId){deviceId='tv-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);localStorage.setItem('gcplay_device_id_tv',deviceId)}
  var activation='https://caiomendes29546874687.github.io/GC-PLAY-PRO-/connect.html?device='+encodeURIComponent(deviceId)+'&code='+encodeURIComponent(code);
  try{if(window.QRCode)new QRCode(document.getElementById('qr'),{text:activation,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});else document.getElementById('qr').textContent='QR';}catch(e){document.getElementById('qr').textContent=code}
  var b=document.getElementById('ok');try{b.focus()}catch(e){}
  document.addEventListener('keydown',function(e){
    var k=e.key||''; var codeKey=e.keyCode;
    if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'||codeKey===37||codeKey===38||codeKey===39||codeKey===40){e.preventDefault();e.stopPropagation();b.classList.add('focus');try{b.focus()}catch(x){}return;}
    if(k==='Enter'||k==='OK'||k==='Select'||codeKey===13){e.preventDefault();e.stopPropagation();b.click();return;}
  },true);
  b.addEventListener('click',function(){alert('Código de ativação: '+code);});
})();
</script></body></html>
