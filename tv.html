<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC PLAY PRO TV</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.box{width:min(900px,88vw);padding:30px 40px;border:3px solid #28d905;border-radius:22px;text-align:center;box-shadow:0 0 35px rgba(40,217,5,.25)}
h1{font-size:42px;margin:0 0 12px;color:#28d905}.label{font-size:25px;margin:8px}
.code{font-size:60px;letter-spacing:12px;font-weight:bold;border:2px solid #28d905;border-radius:14px;padding:14px;margin:15px 0}
.row{display:flex;align-items:center;justify-content:center;gap:45px;margin:15px 0}
.qr{width:190px;height:190px;background:#fff;padding:10px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{max-width:190px;max-height:190px}.hint{font-size:20px;margin:10px}
.status{font-size:21px;font-weight:bold;color:#28d905;margin:12px}.btn{display:inline-block;margin-top:10px;padding:15px 42px;border:2px solid #28d905;border-radius:12px;font-size:25px;color:#fff;background:#111;cursor:pointer}
.btn.focus,.btn:focus{outline:4px solid #28d905;outline-offset:5px;box-shadow:0 0 20px rgba(40,217,5,.45)}
</style>
</head>
<body>
<main class="box">
<h1>GC PLAY PRO</h1>
<div class="label">ATIVAÇÃO DO DISPOSITIVO</div>
<div class="label">Código de ativação</div>
<div id="code" class="code">------</div>
<div class="row">
  <div id="qr" class="qr"></div>
  <div>
    <div class="hint">Escaneie o QR Code pelo celular</div>
    <div class="hint">ou use o código acima.</div>
    <div id="status" class="status">CONECTANDO AO SERVIDOR...</div>
    <button id="ok" class="btn" type="button">CONTINUAR</button>
  </div>
</div>
</main>
<script>
(function(){
'use strict';

var SUPABASE='https://kuzgdvpdqmocklsgyzvt.supabase.co';
var ACTIVATE=SUPABASE+'/functions/v1/activate-device';
var SUPABASE_KEY='sb_publishable_2qV7Uw-99dQlVcXluSuikw_YZGClN13';
var ACTIVATION_PAGE='https://caiomendes29546874687.github.io/GC-PLAY-PRO-/connect.html';
var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

function makeCode(){
  var c='';
  for(var i=0;i<6;i++) c+=chars.charAt(Math.floor(Math.random()*chars.length));
  return c;
}

function makeUUID(){
  if(window.crypto && typeof window.crypto.randomUUID==='function'){
    return window.crypto.randomUUID();
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;
    var v=c==='x'?r:(r&3)|8;
    return v.toString(16);
  });
}

/*
 * IMPORTANTE:
 * O connect.html aceita somente UUID v4.
 * Se a TV tiver um ID antigo como "tv-...", substituímos por UUID.
 */
var deviceId=localStorage.getItem('gcplay_device_id');
var code=localStorage.getItem('gcplay_activation_code');
var uuidRegex=/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

if(!uuidRegex.test(String(deviceId||''))){
  deviceId=makeUUID();
  localStorage.setItem('gcplay_device_id',deviceId);
}

if(!/^[A-Z0-9]{6}$/.test(String(code||''))){
  code=makeCode();
  localStorage.setItem('gcplay_activation_code',code);
}

code=String(code).toUpperCase();

document.getElementById('code').textContent=code;

var activation=ACTIVATION_PAGE+'?device='+encodeURIComponent(deviceId)+'&code='+encodeURIComponent(code);

try{
  new QRCode(document.getElementById('qr'),{
    text:activation,width:190,height:190,correctLevel:QRCode.CorrectLevel.M
  });
}catch(e){
  document.getElementById('qr').textContent=code;
}

var statusEl=document.getElementById('status');
var btn=document.getElementById('ok');

function statusText(t){statusEl.textContent=t;}

function headers(){
  return {
    'Content-Type':'application/json',
    'apikey':SUPABASE_KEY,
    'Authorization':'Bearer '+SUPABASE_KEY,
    'Accept':'application/json'
  };
}

async function register(){
  statusText('CONECTANDO AO SERVIDOR...');
  try{
    var r=await fetch(ACTIVATE,{
      method:'POST',
      headers:headers(),
      body:JSON.stringify({
        action:'register',
        device_id:deviceId,
        activation_code:code
      })
    });

    var raw=await r.text();
    var data=null;
    try{data=JSON.parse(raw);}catch(e){}

    if(r.ok){
      statusText('TV REGISTRADA — AGUARDANDO ATIVAÇÃO');
      return true;
    }

    console.warn('Registro TV:',r.status,raw,data);
    statusText('AGUARDANDO CONEXÃO');
    return false;
  }catch(e){
    console.warn('Registro TV:',e);
    statusText('AGUARDANDO CONEXÃO');
    return false;
  }
}

async function check(){
  try{
    var r=await fetch(ACTIVATE,{
      method:'POST',
      headers:headers(),
      body:JSON.stringify({
        action:'status',
        device_id:deviceId,
        activation_code:code
      })
    });

    if(!r.ok)return;
    var d=await r.json();

    if(d && d.success && d.device){
      var st=String(d.device.status||'').toLowerCase();
      if(st==='active'){
        statusText('✓ TV ATIVADA');
        btn.textContent='ENTRAR NO GC PLAY PRO';
        btn.classList.add('focus');
        return;
      }
      if(st==='blocked'){
        statusText('TV BLOQUEADA');
        return;
      }
      statusText('TV REGISTRADA — AGUARDANDO ATIVAÇÃO');
    }
  }catch(e){
    console.warn('Status TV:',e);
  }
}

btn.onclick=function(){check();};

btn.onkeydown=function(e){
  var k=e.key||'',n=e.keyCode;
  if(k==='Enter'||k==='OK'||k==='Select'||n===13){
    e.preventDefault();e.stopPropagation();btn.click();
  }
};

document.addEventListener('keydown',function(e){
  var k=e.key||'',n=e.keyCode;
  if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'||n===37||n===38||n===39||n===40){
    e.preventDefault();
    e.stopPropagation();
    btn.classList.add('focus');
    try{btn.focus();}catch(x){}
  }
  if(k==='Enter'||k==='OK'||k==='Select'||n===13){
    e.preventDefault();
    e.stopPropagation();
    btn.click();
  }
},true);

try{btn.focus();}catch(e){}

(async function start(){
  await register();
  await check();
  setInterval(check,5000);
})();

})();
</script>
</body>
</html>
